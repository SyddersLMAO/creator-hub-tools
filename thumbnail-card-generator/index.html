<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video card maker</title>
  <meta name="description" content="Make a thumbnail, title and uploader card for any YouTube video.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Video card maker</h1>
  <p class="sub">Paste a YouTube link. The thumbnail, title and uploader fill in automatically.</p>

  <section class="panel" aria-label="Card details">
    <label>YouTube link
      <input type="text" id="link" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" autofocus>
    </label>
    <p class="hint" id="fetchStatus" role="status">Waiting for a link.</p>

    <label>Title
      <input type="text" id="title" value="The video title goes here, up to two lines" maxlength="140">
    </label>
    <label>Uploader
      <input type="text" id="channel" value="Channel name">
    </label>

    <div class="row">
      <label>Card style
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Background
        <select id="bgmode">
          <option value="shadow">Transparent + shadow</option>
          <option value="none">Card only</option>
        </select>
      </label>
      <label>Size
        <select id="scale">
          <option value="2">Large (2×)</option>
          <option value="3">Extra large (3×)</option>
          <option value="1">Standard (1×)</option>
        </select>
      </label>
    </div>

    <div class="drop" id="avDrop" tabindex="0" role="button" aria-label="Add channel avatar">
      <span id="avText">Channel avatar (optional): click to choose an image</span>
    </div>
    <input type="file" id="avFile" accept="image/*" class="sr" tabindex="-1">

    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Replace thumbnail">
      <span id="dropText">Thumbnail not loading? Drop an image here, click to choose, or paste one.</span>
    </div>
    <input type="file" id="thumbFile" accept="image/*" class="sr" tabindex="-1">
  </section>

  <section class="stage" aria-label="Preview">
    <img id="out" alt="Preview of the video card" width="640">
    <div class="actions">
      <button class="primary" id="dlBtn" type="button">Download PNG</button>
      <button id="copyBtn" type="button">Copy image</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
