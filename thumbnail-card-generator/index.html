<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Listing Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>YouTube Listing Generator</h1>
            <p>Generate a YouTube-style video listing.</p>
        </header>

        <section class="workspace">
            <div class="controls">
                <label for="videoUrl">YouTube URL</label>
                <div class="url-row">
                    <input id="videoUrl" type="url" placeholder="Paste a YouTube link">
                    <button id="loadVideo">Load</button>
                </div>

                <label for="thumbnailUpload">Custom thumbnail</label>
                <input id="thumbnailUpload" type="file" accept="image/*">

                <label for="title">Video title</label>
                <input id="title" type="text" placeholder="Video title">

                <label for="channel">Channel name</label>
                <input id="channel" type="text" placeholder="Channel name">

                <label for="avatarUpload">Channel profile picture</label>
                <input id="avatarUpload" type="file" accept="image/*">

                <label for="views">Views and upload date</label>
                <input id="views" type="text" placeholder="120K views · 2 days ago">

                <button class="download" id="download">Download PNG</button>
                <p id="status"></p>
            </div>

            <div class="preview-area">
                <p class="preview-label">Preview</p>
                <div class="listing">
                    <div class="thumbnail">
                        <img id="previewThumbnail" alt="">
                    </div>

                    <div class="details">
                        <img id="previewAvatar" class="avatar" alt="">
                        <div class="copy">
                            <div id="previewTitle" class="video-title">Your video title</div>
                            <div id="previewChannel" class="channel">Channel name</div>
                            <div id="previewViews" class="views">Views · upload date</div>
                        </div>
                        <span class="more">⋮</span>
                    </div>
                </div>
            </div>
        </section>

        <canvas id="canvas" width="1280" height="920" hidden></canvas>
    </main>

    <script src="app.js"></script>
</body>
</html>
